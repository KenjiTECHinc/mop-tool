name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests supply their own database path. These stand-ins keep the API
      # config valid without repository secrets. Seed tests that need a random
      # password delete DEMO_PASSWORD themselves.
      SESSION_SECRET: test-session-secret-value
      TOTP_KEY: test-totp-key-value-ok
      AWS_BEARER_TOKEN_BEDROCK: test-bedrock-token
      BEDROCK_MODEL_ID: test-model
      DEMO_PASSWORD: "123456789012"
      AWS_PROFILE: ""
      APP_ROLE_ARN: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
