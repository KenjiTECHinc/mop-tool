name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests supply their own database path. These stand-ins keep the API
      # config valid without repository secrets. Seed tests that need a random
      # password delete DEMO_PASSWORD themselves.
      SESSION_SECRET: test-session-secret-value
      TOTP_KEY: test-totp-key-value-ok
      OPENAI_BASE_URL: https://bedrock-mantle.ap-southeast-2.api.aws/v1
      OPENAI_API_KEY: test-key
      BEDROCK_MODEL_ID: openai.gpt-oss-120b
      DEMO_PASSWORD: "123456789012"
      AWS_PROFILE: ""
      APP_ROLE_ARN: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
